services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incys
      POSTGRES_USER: incys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["incys_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incys -d incys"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  incys_data:
